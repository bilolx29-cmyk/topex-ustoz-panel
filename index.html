<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="h0V9iEkGD9baZwYVzlWabyZp6j827MLbjKHjwW9YVR8" />
  <title>Topex Ustoz — TOPEX Texnikum O'qituvchi Boshqaruv Tizimi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=1.3">
</head>
<body>
  <!-- Faqat internet qotib qolganda yoki ishlamay qolganda chiqadigan loader animatsiyasi (saytga kirishda / yangilaganda umuman chiqmaydi) -->
  <div id="net-loader" class="net-loader hidden" style="display: none;" role="status" aria-live="polite">
    <div class="net-loader-backdrop"></div>
    <div class="net-loader-card">
      <button type="button" class="net-loader-close" id="net-loader-close" title="Yopish (Oflayn davom etish)">✕</button>
      <div class="net-loader-logo-wrap">
        <div class="net-loader-logo">T</div>
        <div class="net-loader-spinner"></div>
      </div>
      <div class="net-loader-text">
        <span class="net-loader-title" id="net-loader-title">Internet aloqasi past</span>
        <span class="net-loader-sub" id="net-loader-sub">Tarmoq tezligi pastligi sababli ma'lumotlar kutilmoqda...</span>
      </div>
      <div class="net-loader-bar">
        <div class="net-loader-bar-fill"></div>
      </div>
    </div>
  </div>

  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <canvas id="confetti-canvas"></canvas>

  <script src="js/api.js?v=1.3"></script>
  <script src="js/data.js?v=1.3"></script>
  <script src="js/store.js?v=1.3"></script>
  <script src="js/app.js?v=1.3"></script>
</body>
</html>
